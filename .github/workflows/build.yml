name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  deb:
    name: deb (Ubuntu 24.04, GNOME 46)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set package version
        id: version
        run: printf 'package=%s\n' "$(bash packaging/ci-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Build, install, smoke-test and remove the package in Docker
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package }}
        run: |
          docker build -f packaging/Dockerfile --build-arg PACKAGE_VERSION="$PACKAGE_VERSION" -t gradia-capture-gnome46 .
          mkdir -p dist
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/dist:/out" gradia-capture-gnome46
          dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu-24.04-gnome-46
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
